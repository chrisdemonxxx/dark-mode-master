<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Mode Master</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
      width: 280px;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .header p {
      font-size: 0.75rem;
      opacity: 0.6;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .toggle-label {
      font-size: 0.9rem;
      font-weight: 500;
    }
    .status-text {
      font-size: 0.75rem;
      opacity: 0.7;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #555;
      border-radius: 26px;
      transition: 0.3s;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 20px; width: 20px;
      left: 3px; bottom: 3px;
      background-color: #fff;
      border-radius: 50%;
      transition: 0.3s;
    }
    input:checked + .slider {
      background-color: #4a69bd;
    }
    input:checked + .slider::before {
      transform: translateX(22px);
    }
    .info {
      margin-top: 14px;
      font-size: 0.7rem;
      opacity: 0.5;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Dark Mode Master</h1>
    <p>Free dark mode for all websites</p>
  </div>
  <div class="toggle-row">
    <div>
      <div class="toggle-label">Dark Mode</div>
      <div class="status-text" id="status">Enabled on this site</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="darkToggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="info">
    Your eyes will thank you. Automatically applies to all websites.
  </div>
  <script src="popup.js"></script>
</body>
</html>
